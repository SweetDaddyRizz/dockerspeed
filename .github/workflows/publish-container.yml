name: Publish container

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */8 * * *"

permissions:
  contents: read
  packages: write

env:
  UPSTREAM_REPO: diamondStar35/top_speed
  UPSTREAM_RELEASE_TAG: release-build
  IMAGE_REPOSITORY: topspeed-server
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}

    steps:
      - name: Resolve upstream release version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          release_json="$(gh api "repos/${UPSTREAM_REPO}/releases/tags/${UPSTREAM_RELEASE_TAG}")"
          asset_name="$(jq -r '.assets[].name' <<< "${release_json}" | grep -E '^TopSpeed\.Server-linux-(musl-)?(x64|arm64|arm32)-Release-v.*\.zip$' | head -n 1)"

          if [ -z "${asset_name}" ]; then
            echo "No supported TopSpeed.Server release asset found." >&2
            exit 1
          fi

          version="$(sed -E 's/^TopSpeed\.Server-linux-(musl-)?(x64|arm64|arm32)-Release-v-?(.+)\.zip$/\3/' <<< "${asset_name}")"
          if [ "${version}" = "${asset_name}" ]; then
            version="$(date -u +%Y%m%d%H%M%S)"
          fi

          tag="$(tr '[:upper:]' '[:lower:]' <<< "${version}" | sed -E 's/[^a-z0-9_.-]+/-/g')"

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Summary
        run: |
          {
            echo "Resolved upstream version: \`${{ steps.release.outputs.version }}\`"
            echo "Resolved image tag: \`${{ steps.release.outputs.tag }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  decide:
    needs: resolve
    runs-on: ubuntu-latest
    outputs:
      published_version_tag: ${{ steps.compare.outputs.published_version_tag }}
      should_publish: ${{ steps.compare.outputs.should_publish }}

    steps:
      - name: Set image name
        id: image
        run: |
          owner="$(tr '[:upper:]' '[:lower:]' <<< "${GITHUB_REPOSITORY_OWNER}")"
          echo "name=ghcr.io/${owner}/${IMAGE_REPOSITORY}" >> "${GITHUB_OUTPUT}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Check whether this version is already published
        id: compare
        run: |
          set -euo pipefail

          image="${{ steps.image.outputs.name }}"
          version_tag="${{ needs.resolve.outputs.tag }}"

          if docker buildx imagetools inspect "${image}:${version_tag}" >/dev/null 2>&1; then
            echo "published_version_tag=${version_tag}" >> "${GITHUB_OUTPUT}"
            echo "should_publish=false" >> "${GITHUB_OUTPUT}"
          else
            echo "published_version_tag=" >> "${GITHUB_OUTPUT}"
            echo "should_publish=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Summary
        run: |
          {
            echo "Published version tag: \`${{ steps.compare.outputs.published_version_tag || 'none' }}\`"
            echo "Upstream version tag: \`${{ needs.resolve.outputs.tag }}\`"
            if [ "${{ steps.compare.outputs.should_publish }}" = "false" ]; then
              echo ""
              echo "That version is already published. Skipping rebuild."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

  publish:
    needs:
      - resolve
      - decide
    if: needs.decide.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - release_name: amd64
            asset_pattern: ^TopSpeed\.Server-linux-musl-x64-Release-v.*\.zip$
            image_tag: amd64
            platform: linux/amd64
            base_image: mcr.microsoft.com/dotnet/runtime-deps:10.0-alpine
          - release_name: arm64
            asset_pattern: ^TopSpeed\.Server-linux-arm64-Release-v.*\.zip$
            image_tag: arm64
            platform: linux/arm64
            base_image: mcr.microsoft.com/dotnet/runtime-deps:10.0
          - release_name: arm32
            asset_pattern: ^TopSpeed\.Server-linux-arm32-Release-v.*\.zip$
            image_tag: arm32
            platform: linux/arm/v7
            base_image: mcr.microsoft.com/dotnet/runtime-deps:10.0
          - release_name: musl-arm64
            asset_pattern: ^TopSpeed\.Server-linux-musl-arm64-Release-v.*\.zip$
            image_tag: musl-arm64
            platform: linux/arm64
            base_image: mcr.microsoft.com/dotnet/runtime-deps:10.0-alpine

    steps:
      - name: Check out container repo
        uses: actions/checkout@v5

      - name: Resolve upstream server asset
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATTERN: ${{ matrix.asset_pattern }}
        run: |
          set -euo pipefail

          release_json="$(gh api "repos/${UPSTREAM_REPO}/releases/tags/${UPSTREAM_RELEASE_TAG}")"
          asset_name="$(jq -r '.assets[].name' <<< "${release_json}" | grep -E "${ASSET_PATTERN}" | head -n 1)"

          if [ -z "${asset_name}" ]; then
            echo "No matching release asset found for ${ASSET_PATTERN}." >&2
            exit 1
          fi

          asset_url="$(jq -r --arg name "${asset_name}" '.assets[] | select(.name == $name) | .browser_download_url' <<< "${release_json}")"

          expected_version="${{ needs.resolve.outputs.version }}"
          actual_version="$(sed -E 's/^TopSpeed\.Server-linux-(musl-)?(x64|arm64|arm32)-Release-v-?(.+)\.zip$/\3/' <<< "${asset_name}")"

          if [ "${actual_version}" != "${expected_version}" ]; then
            echo "Asset version ${actual_version} does not match resolved version ${expected_version}." >&2
            exit 1
          fi

          echo "asset_url=${asset_url}" >> "${GITHUB_OUTPUT}"
          echo "asset_name=${asset_name}" >> "${GITHUB_OUTPUT}"

      - name: Download server release into app
        env:
          ASSET_URL: ${{ steps.release.outputs.asset_url }}
        run: |
          set -euo pipefail

          rm -rf app
          mkdir app
          curl --fail --location --retry 3 --output /tmp/topspeed-server.zip "${ASSET_URL}"
          unzip -q /tmp/topspeed-server.zip -d app

          shopt -s dotglob nullglob
          entries=(app/*)
          if [ "${#entries[@]}" -eq 1 ] && [ -d "${entries[0]}" ] && [ -f "${entries[0]}/TopSpeed.Server" ]; then
            mkdir /tmp/topspeed-app
            mv "${entries[0]}"/* /tmp/topspeed-app/
            rm -rf app
            mv /tmp/topspeed-app app
          fi

          test -f app/TopSpeed.Server
          test -f app/TopSpeed.Server.dll

      - name: Set image name
        id: image
        run: |
          owner="$(tr '[:upper:]' '[:lower:]' <<< "${GITHUB_REPOSITORY_OWNER}")"
          echo "name=ghcr.io/${owner}/${IMAGE_REPOSITORY}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          sbom: false
          build-args: |
            BASE_IMAGE=${{ matrix.base_image }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ matrix.image_tag }}-latest
            ${{ steps.image.outputs.name }}:${{ matrix.image_tag }}-${{ needs.resolve.outputs.tag }}
          labels: |
            org.opencontainers.image.title=TopSpeed Server
            org.opencontainers.image.description=Containerized TopSpeed.Server release
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://github.com/diamondStar35/top_speed
            org.opencontainers.image.version=${{ needs.resolve.outputs.version }}
            org.opencontainers.image.vendor=diamondStar35/top_speed
            org.opencontainers.image.ref.name=${{ matrix.image_tag }}

      - name: Summary
        run: |
          {
            echo "Published image for ${{ matrix.release_name }}:"
            echo "- \`${{ steps.image.outputs.name }}:${{ matrix.image_tag }}-latest\`"
            echo "- \`${{ steps.image.outputs.name }}:${{ matrix.image_tag }}-${{ needs.resolve.outputs.tag }}\`"
            echo ""
            echo "Source asset: \`${{ steps.release.outputs.asset_name }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  publish-manifests:
    needs:
      - resolve
      - decide
      - publish
    if: needs.decide.outputs.should_publish == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Set image name
        id: image
        run: |
          owner="$(tr '[:upper:]' '[:lower:]' <<< "${GITHUB_REPOSITORY_OWNER}")"
          echo "name=ghcr.io/${owner}/${IMAGE_REPOSITORY}" >> "${GITHUB_OUTPUT}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create default multi-arch manifests
        run: |
          set -euo pipefail

          image="${{ steps.image.outputs.name }}"
          version="${{ needs.resolve.outputs.tag }}"
          sources=(
            "${image}:amd64-${version}"
            "${image}:arm64-${version}"
            "${image}:arm32-${version}"
          )

          for attempt in 1 2 3 4 5; do
            if docker buildx imagetools create \
              --tag "${image}:latest" \
              --tag "${image}:${version}" \
              --annotation "index:org.opencontainers.image.version=${{ needs.resolve.outputs.version }}" \
              --annotation "index:io.topspeed.upstream-release-tag=${{ env.UPSTREAM_RELEASE_TAG }}" \
              "${sources[@]}"; then
              exit 0
            fi

            echo "Manifest publish attempt ${attempt} failed. Waiting for registry propagation..."
            sleep 15
          done

          echo "Failed to publish multi-arch manifest after retries." >&2
          exit 1

      - name: Summary
        run: |
          {
            echo "Published multi-arch tags:"
            echo "- \`${{ steps.image.outputs.name }}:latest\`"
            echo "- \`${{ steps.image.outputs.name }}:${{ needs.resolve.outputs.tag }}\`"
            echo ""
            echo "Default mapping:"
            echo "- amd64 -> musl x64 release"
            echo "- arm64 -> glibc arm64 release"
            echo "- arm32 -> glibc arm32 release"
          } >> "${GITHUB_STEP_SUMMARY}"

  notify-skipped:
    needs:
      - resolve
      - decide
    if: needs.decide.outputs.should_publish == 'false'
    runs-on: ubuntu-latest

    steps:
      - name: Publish ntfy skipped notification
        env:
          NTFY_TOPIC_URL: ${{ secrets.NTFY_TOPIC_URL }}
          NTFY_ACCESS_TOKEN: ${{ secrets.NTFY_ACCESS_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail

          if [ -z "${NTFY_TOPIC_URL}" ]; then
            exit 0
          fi

          auth_args=()
          if [ -n "${NTFY_ACCESS_TOKEN}" ]; then
            auth_args=(-H "Authorization: Bearer ${NTFY_ACCESS_TOKEN}")
          fi

          message="TopSpeed release-build is still ${VERSION}. Version ${VERSION} is already published, so no image build was needed.

Run: ${RUN_URL}"

          curl --fail --silent --show-error \
            -H "Title: TopSpeed check skipped" \
            -H "Priority: default" \
            -H "Tags: information_source,skip" \
            "${auth_args[@]}" \
            -d "${message}" \
            "${NTFY_TOPIC_URL}"

  notify-published:
    needs:
      - resolve
      - decide
      - publish-manifests
    if: needs.decide.outputs.should_publish == 'true' && needs.publish-manifests.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Publish ntfy success notification
        env:
          NTFY_TOPIC_URL: ${{ secrets.NTFY_TOPIC_URL }}
          NTFY_ACCESS_TOKEN: ${{ secrets.NTFY_ACCESS_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          VERSION: ${{ needs.resolve.outputs.version }}
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/topspeed-server
        run: |
          set -euo pipefail

          if [ -z "${NTFY_TOPIC_URL}" ]; then
            exit 0
          fi

          image_name="$(printf '%s' "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"

          auth_args=()
          if [ -n "${NTFY_ACCESS_TOKEN}" ]; then
            auth_args=(-H "Authorization: Bearer ${NTFY_ACCESS_TOKEN}")
          fi

          message="Published TopSpeed server version ${VERSION} to ${image_name} with updated latest and version tags.

Run: ${RUN_URL}"

          curl --fail --silent --show-error \
            -H "Title: TopSpeed image published" \
            -H "Priority: default" \
            -H "Tags: white_check_mark,package,new" \
            "${auth_args[@]}" \
            -d "${message}" \
            "${NTFY_TOPIC_URL}"

  notify-failed:
    needs:
      - resolve
      - decide
      - publish
      - publish-manifests
      - notify-skipped
      - notify-published
    if: failure()
    runs-on: ubuntu-latest

    steps:
      - name: Publish ntfy failure notification
        env:
          NTFY_TOPIC_URL: ${{ secrets.NTFY_TOPIC_URL }}
          NTFY_ACCESS_TOKEN: ${{ secrets.NTFY_ACCESS_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail

          if [ -z "${NTFY_TOPIC_URL}" ]; then
            exit 0
          fi

          auth_args=()
          if [ -n "${NTFY_ACCESS_TOKEN}" ]; then
            auth_args=(-H "Authorization: Bearer ${NTFY_ACCESS_TOKEN}")
          fi

          if [ -n "${VERSION}" ]; then
            message="The TopSpeed container workflow failed while processing upstream version ${VERSION}. Check the GitHub Actions run for details.

Run: ${RUN_URL}"
          else
            message="The TopSpeed container workflow failed before it could resolve the upstream version. Check the GitHub Actions run for details.

Run: ${RUN_URL}"
          fi

          curl --fail --silent --show-error \
            -H "Title: TopSpeed publish failed" \
            -H "Priority: high" \
            -H "Tags: warning,rotating_light,failed" \
            "${auth_args[@]}" \
            -d "${message}" \
            "${NTFY_TOPIC_URL}"
